# Publishes @revenuedot/mcp to npm when a tag v<version> is pushed.
# npm trusted publishing: the package trusts this repo + release.yml + environment production over GitHub OIDC,
# so no npm token is stored anywhere. Provenance is attached automatically.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run everything but publish with --dry-run
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency: { group: release, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { path: mcp }
      # The tests start a real RevenueDot server from the monorepo, in-process on PGlite.
      - uses: actions/checkout@v5
        with: { repository: revenuedot/revenuedot, path: revenuedot }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
        working-directory: revenuedot
      - run: pnpm install --frozen-lockfile
        working-directory: mcp
      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        working-directory: mcp
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
      - run: pnpm typecheck && pnpm build && pnpm test
        working-directory: mcp
      - name: Publish
        working-directory: mcp
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --provenance --access public --ignore-scripts --dry-run
          elif npm view "@revenuedot/mcp@${version}" version >/dev/null 2>&1; then
            echo "@revenuedot/mcp@${version} is already on npm; nothing to publish."
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      - name: Check the published server runs
        if: inputs.dry_run != true
        run: |
          version=$(node -p "require('./mcp/package.json').version")
          cd "$RUNNER_TEMP" && for i in 1 2 3 4 5 6; do npx -y "@revenuedot/mcp@${version}" --help >/dev/null && exit 0; sleep 10; done; exit 1
